[project]
name = "rk3588-ai"
version = "0.0.0"
description = "PC side of RK3588 PPE detection: datasets, training, export, evaluation, NPU measurement"
requires-python = ">=3.12,<3.13"
# Versions from legacy-final:pyproject.toml and uv.lock. av and lap (demo only) come back with scripts/demo.
dependencies = [
    "rk3588-common",
    "torch==2.4.0",
    "numpy<=1.26.4",
    "setuptools<82",
    "ultralytics==8.4.154",  # exact: evaluation results depend on it
    "pyyaml>=6.0",
    "rknn-toolkit2==2.3.2",
    "onnx==1.18.0",  # Ultralytics RKNN export needs onnx<1.19; version of every existing export
    "onnxslim==0.1.96",  # graph slimming before .rknn; version of every existing export
]

# Not installed: commands run from this directory (`python -m ai.<module>`), as in legacy.
[tool.uv]
package = false

[tool.uv.sources]
rk3588-common = { workspace = true }
